# Managed by nova-switch-tts-engine — do not hand-edit. The switcher installs
# this file as /etc/systemd/system/nova-voice.service.d/zz-engine.conf when the
# Classic (Qwen vLLM) engine is selected. The values repeat tts-stream.conf on
# purpose: the selected engine is always fully described by zz-engine.conf, so
# a stale earlier drop-in can never decide the backend.
[Unit]
# Reset inherited requirements, then depend on the Classic engine unit. The
# base unit deliberately has no TTS dependency (the two engines are mutually
# exclusive); the selected engine's drop-in is what wires it in.
Requires=
Requires=nova-voice-llm.service nova-voice-tts.service
After=nova-voice-tts.service

[Service]
Environment=NOVA_VOICE_TTS_BACKEND=vllm
Environment=NOVA_VOICE_TTS_STREAM_BASE_URL=http://127.0.0.1:8091
Environment=NOVA_VOICE_TTS_SAMPLE_RATE=24000
