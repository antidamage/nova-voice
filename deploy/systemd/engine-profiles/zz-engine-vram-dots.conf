# Managed by nova-switch-tts-engine — do not hand-edit. Installed as
# /etc/systemd/system/nova-voice-llm.service.d/zz-engine-vram.conf while the
# Custom (dots.tts) engine is resident, and removed in Classic mode.
#
# VRAM rebalance: dots fp16 (~6.5 GiB) is larger than the Classic Qwen TTS it
# replaces, so the shared 11 GiB GPU no longer fits llm(full) + dots + STT.
# Offload layers to CPU (n-gpu-layers 99 -> 24, ~700 MB freed) so speaker
# recognition stays resident. Context stays at 8192 (NOT trimmed): the voice
# interpretation prompt — system prompt + tool schemas + live household state —
# reaches ~7.5k tokens on device-heavy turns, so a smaller window silently
# overflows and the agent never replies. The extra KV cache from 8192 lands
# mostly on the CPU-offloaded layers (--cache-ram), so its GPU cost is bounded.
[Service]
ExecStart=
ExecStart=/opt/nova-voice/runtime/llama.cpp/build/bin/llama-server --model /opt/nova-voice/models/qwen3.5-4b-q4_k_m.gguf --alias Qwen3.5-4B --host 127.0.0.1 --port 8765 --ctx-size 16384 --parallel 1 --n-gpu-layers 24 --cache-type-k q8_0 --cache-type-v q8_0 --cache-ram 1024 --jinja --no-webui
