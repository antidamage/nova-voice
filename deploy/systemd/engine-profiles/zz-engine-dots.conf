# Managed by nova-switch-tts-engine — do not hand-edit. The switcher installs
# this file as /etc/systemd/system/nova-voice.service.d/zz-engine.conf when the
# Custom (dots.tts) engine is selected. "zz" sorts after tts-stream.conf, whose
# Classic backend values these override.
[Unit]
# Reset inherited requirements, then depend on the Custom engine unit so a stop
# of the (inactive) Classic unit can never propagate into the orchestrator.
Requires=
Requires=nova-voice-llm.service nova-voice-dots-tts.service
After=nova-voice-dots-tts.service

[Service]
Environment=NOVA_VOICE_TTS_BACKEND=dots
Environment=NOVA_VOICE_DOTS_STREAM_BASE_URL=http://127.0.0.1:8095
Environment=NOVA_VOICE_DOTS_SAMPLE_RATE=48000
# Boot fallback voice until the first dashboard settings pull applies the live
# clone id (VoiceSettings.custom_speaker).
Environment=NOVA_VOICE_TTS_SPEAKER=johnny_multi
