# Managed by nova-switch-tts-engine — do not hand-edit. The switcher installs
# this file as /etc/systemd/system/nova-voice.service.d/zz-engine.conf when the
# Trained (GPT-SoVITS) engine is selected. "zz" sorts after tts-stream.conf,
# whose Classic backend values these override.
[Unit]
# Reset inherited requirements, then depend on the Trained engine unit so a stop
# of an inactive engine unit can never propagate into the orchestrator.
Requires=
Requires=nova-voice-llm.service nova-voice-trained-tts.service
After=nova-voice-trained-tts.service

[Service]
Environment=NOVA_VOICE_TTS_BACKEND=gptsovits
Environment=NOVA_VOICE_TRAINED_STREAM_BASE_URL=http://127.0.0.1:8096
Environment=NOVA_VOICE_TRAINED_SAMPLE_RATE=32000
# Boot fallback voice until the first dashboard settings pull applies the live
# trained-checkpoint id (VoiceSettings.trained_speaker). Empty = engine default.
Environment=NOVA_VOICE_TTS_SPEAKER=
